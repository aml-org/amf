repositories:
  amfLocalPath: "~/mulesoft/amf"
  apbLocalPath: "~/mulesoft/apb"
  specLocalPath: "~/mulesoft/agent-fabric-specification"
specs:
  - name: "agent card"
    amf-module: "amf-agent-card"
    schema:
      spec: "agent-fabric-schema/src/main/resources/agent_card.json"
      amf: "shared/src/main/resources/schema_agent_card.json"
    instances:
      spec:
        valid: "agent-fabric-schema/src/test/resources/agent_card/basic/valid"
        invalid: "agent-fabric-schema/src/test/resources/agent_card/basic/invalid"
      amf:
        valid: "shared/src/test/resources/instances/valid"
        invalid: "shared/src/test/resources/instances/invalid"
      apb:
        valid:
          - "apb/shared/src/test/resources/spec/local/agent-card"
          - "apb/shared/src/test/resources/api-project/local/main-agent-card"
        invalid: "apb/shared/src/test/resources/spec/local/agent-card-invalid"
  - name: "agent metadata"
    amf-module: "amf-agent-metadata"
    schema:
      spec: "agent-fabric-schema/src/main/resources/agent_metadata.json"
      amf: "shared/src/main/resources/schema_agent_metadata.json"
    instances:
      spec:
        valid: "agent-fabric-schema/src/test/resources/agent_metadata/basic/valid"
        invalid: "agent-fabric-schema/src/test/resources/agent_metadata/basic/invalid"
      amf:
        valid: "shared/src/test/resources/instances/valid"
        invalid: "shared/src/test/resources/instances/invalid"
      apb:
        valid:
          - "apb/shared/src/test/resources/spec/local/agent-metadata"
          - "apb/shared/src/test/resources/api-project/local/main-agent-metadata"
        invalid: "apb/shared/src/test/resources/spec/local/agent-metadata-invalid"
  - name: "agent network"
    amf-module: "amf-agent-network"
    schema:
      spec: "agent-fabric-schema/src/main/resources/agent_network_v1.json"
      amf: "shared/src/main/resources/schema_agent_network.json"
    instances:
      spec:
        valid: "agent-fabric-schema/src/test/resources/agent_network/basic/valid"
        invalid: "agent-fabric-schema/src/test/resources/agent_network/basic/invalid"
      amf:
        valid: "shared/src/test/resources/instances/valid"
        invalid: "shared/src/test/resources/instances/invalid"
      apb:
        valid:
          - "apb/shared/src/test/resources/spec/local/agent-network"
          - "apb/shared/src/test/resources/api-project/local/main-agent-network"
        invalid: "apb/shared/src/test/resources/spec/local/agent-network-invalid"
  - name: "agentic network"
    amf-module: "amf-agentic-network"
