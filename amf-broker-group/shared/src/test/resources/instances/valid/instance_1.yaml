# TODO: update from https://github.com/mulesoft-emu/agent-fabric-specification/blob/spike/ans/examples/demo-project/agent-network.yaml
# This document is no longer just for broker but it allows us to describe the ai network (like a backend for the visualizer that can be deployed)
# This makes the brokers, agents, mcps and llms as first class citizens.
# This not only allows us to deploy brokers but also describe the network that are outside of our platform and visualize it, without the need of crawler
# This does not replace the Exchange UI but provides a declarative way to describe the entire network
# Agent Network Specification
ansVersion: 1.0.0
# The list of brokers that are part of the network.
brokers:
  google-maps-broker:
    card: #    The a2a Card
      protocolVersion: 0.2.9
      name: GeoSpatial Route Planner Agent
      description: Provides advanced route planning, traffic analysis, and custom map generation services. This agent can calculate optimal routes, estimate travel times considering real-time traffic, and create personalized maps with points of interest.
      url: https://${ingressgw.url}/a2a/maps/v1
      capabilities: {}
      version: 1.0.0
      provider:
        organization: Acme Inc.
        url: https://www.acme.com
      securitySchemes:
        oAuth2ClientCredentials:
          type: oauth2
          flows:
            clientCredentials:
              tokenUrl: https://${envUrl}/token
              scopes:
                read: Grants read access

      security:
        - oAuth2ClientCredentials:
            - openid
            - profile
            - email
      defaultInputModes:
        - application/json
        - text/plain
      defaultOutputModes:
        - application/json
        - image/png
      skills:
        - id: route-optimizer-traffic
          name: Traffic-Aware Route Optimizer
          description: Calculates the optimal driving route between two or more locations,
            taking into account real-time traffic conditions, road closures, and user preferences
            (e.g., avoid tolls, prefer highways).
          examples:
            - Plan a route from '1600 Amphitheatre Parkway, Mountain View, CA' to 'San Francisco
              International Airport' avoiding tolls.
            - '{"origin": {"lat": 37.422, "lng": -122.084}, "destination": {"lat": 37.7749,
              "lng": -122.4194}, "preferences": ["avoid_ferries"]}'
          inputModes:
            - application/json
            - text/plain
          outputModes:
            - application/json
            - application/vnd.geo+json
            - text/html
          tags:
            - maps
    spec: # The spec section defines behavior. In this case of the broker. This means that this definition can be deployed.
      llm:
        llmRef:
          # Declares that needs a connection to the specified llm.
          name: my-einstein
      # Configuration of the broker. Should we put this under a configuration section?
      maxNumberOfLoops: 10
      maxConsecutiveErrors: 1
      instructions:
        - You're mission is helping people find the best route possible between two points. You will extract origin and destination
        - If the user didn't say otherwise, assume they are traveling by car. Valid transportation means are Car, Bicycle, walking, and public transport.
        - If the user says they're riding a motorcycle, treat it the same as cars.
        - When presenting routes, present the one with the lowest total distance, the one with the lowest fuel consumption, and the fastest one.
        - Check the weather in the areas involved in the route and show a warning if there are any weather alerts.
      # References the tools to be linked to the broker.
      tools:
        - mcpRef:
            name: google-maps-mcp
          allowed:
            - geocode
            - trace-route
            - render-route
      # References the agents to be linked to the broker.
      links:
        - agentRef:
            name: weather-agent

      # List of policies to be applied to the broker.
      policies:
        - policyRef:
            name: rate-limit
          config:
agents:
  # An external agent that is not part of the network but we can connect to them if needed
  test-agent:
    metadata:
      platform: agentforce
      protocol: other
      # We can declare the a2a card here. Or we can specify cardUrl: and we can download it on publish time
      links:
        # We can also declare links to other agents. This will allow us to render this metadata in the visualizer UI. And apply governance to this
        - agentRef:
            name: sf-crm-agent

  weather-agent:
    description: "An agent that handles the weather forecast"
    metadata:
      platform: gemini
      protocol: a2a
      # We can declare the a2a card here. Or we can specify cardUrl: and we can download it on publish time
      tools:
        # We can also declare links to other agents. This will allow us to render this metadata in the visualizer UI. And apply governance to this
        - mcpRef:
            name: weather-mcp
  sf-crm-agent:
    metadata:
      platform: agentforce
      protocol: other


mcps:
  # We can declare the mcp here.
  # In a future version with the MCP Transcoding work we can potencially create MCP servers automatically form api specs. By adding a spec section to this.
  google-maps-mcp:
    metadata:
      transport:
        kind: streamableHttp
        path: /mcp

llms:
  my-enistein:
    description: This is a description of the llm.
    metadata:
      platform: einstein
      policyRef:
        name: llmgw-einstein
#This section describes the physical connections to agents, llms and mcps. This represents the real wireing of the nodes.
connections:
  #Sugar syntax. If registryRef is not specified the name of the connection is used.
  weather-agent:
    kind: agent
    agentRef:
      name: weather-agent
    spec:
      url: https://weather-agent.anypoint.mulesoft.com/
      authentication:
        kind: oauth2-client-credentials
        clientId: ${weather.clientId}
        clientSecret: ${weather.clientSecret}
        tokenUrl: ${weather.tokenUrl}
      policies:
        - policyRef:
            name: a-two-a-pii-detector
          configuration:
            entities:
              - Email
              - US SSN
            action: Log


  my-einstein:
    kind: llm
    llmRef:
      name: my-enistein
    spec:
      url: ${}
      configuration:
        apiKey: ${einstein.apiKey}

  google-maps-mcp:
    kind: mcp
    spec:
      url: https://maps.google.com/mcp