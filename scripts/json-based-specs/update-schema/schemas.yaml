      spec: "agent-fabric-schema/src/main/resources/agent_network_v2.json"
      amf: "shared/src/main/resources/schema_agentic_network.json"
    instances:
      spec:
        valid: "agent-fabric-schema/src/test/resources/agent_network_v2/basic/valid"
        invalid: "agent-fabric-schema/src/test/resources/agent_network_v2/basic/invalid"
      amf:
        valid: "shared/src/test/resources/instances/valid"
        invalid: "shared/src/test/resources/instances/invalid"
      apb:
        valid:
          - "apb/shared/src/test/resources/spec/local/agentic-network"
          - "apb/shared/src/test/resources/api-project/local/main-agentic-network"
        invalid: "apb/shared/src/test/resources/spec/local/agentic-network-invalid"
  - name: "llm metadata"
    amf-module: "amf-llm-metadata"
    schema:
      spec: "agent-fabric-schema/src/main/resources/llm_metadata.json"
      amf: "shared/src/main/resources/schema_llm_metadata.json"
    instances:
      spec:
        valid: "agent-fabric-schema/src/test/resources/llm_metadata/basic/valid"
        invalid: "agent-fabric-schema/src/test/resources/llm_metadata/basic/invalid"
      amf:
        valid: "shared/src/test/resources/instances/valid"
        invalid: "shared/src/test/resources/instances/invalid"
      apb:
        valid:
          - "apb/shared/src/test/resources/spec/local/llm-metadata"
