agentNetwork: "2.0.0"
info:
  title: Network with Connection Policies
  version: 1.0.0
registry:
  agents:
    target-agent:
      metadata:
        platform: Mulesoft
        protocol: a2a
context:
  policies:
    shared-rate-limit:
      ref:
        name: rate-limit
      configuration:
        maxRequests: 100
        windowSeconds: 60
  connections:
    my-connection:
      kind: a2a
      ref:
        name: target-agent
      url: https://target.example.com
      authentication:
        kind: basic
        username: user
        password: password
      policies:
        inbound:
          - ref:
              name: shared-rate-limit
          - policy:
              ref:
                name: logging
                namespace: mulesoft.policies
              configuration:
                level: DEBUG
        outbound:
          - policy:
              ref:
                name: circuit-breaker
              configuration:
                threshold: 5