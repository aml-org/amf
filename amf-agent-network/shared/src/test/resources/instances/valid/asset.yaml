schemaVersion: 1.0.0
label: Weather
brokers:
  weather-agent:
    card:
      protocolVersion: 0.2.9
      name: Agent that now how to handle the weather
      description: Provides advanced route planning, traffic analysis, and custom map generation services. This agent can calculate optimal routes, estimate travel times considering real-time traffic, and create personalized maps with points of interest.
      url: https://${ingressgw.url}/weather-agent
      capabilities: { }
      version: 1.0.0
      provider:
        organization: Acme Inc.
        url: https://www.acme.com
      securitySchemes:
        anypointApiKey:
          type: apiKey
          in: header
          name: client_id/client_secret
      defaultInputModes:
        - application/json
        - text/plain
      defaultOutputModes:
        - application/json
        - image/png
      skills:
        - id: weather-agent-skills
          name: Handles the weather
          description: Can calculate the weather for a given location at a given time
          examples:
            - What is the weather in buenos aires in 2025 12 of May
          inputModes:
            - application/json
            - text/plain
          outputModes:
            - application/json
            - application/vnd.geo+json
            - text/html
          tags:
            - weather
    spec:
      llm:
        ref:
          name: open-ai
        configuration:
          model: gpt-5-nano
      maxNumberOfLoops: 10
      maxConsecutiveErrors: 1
      instructions:
        - You are a weather agent
      tools:
        - mcp:
            ref:
              name: weather-mcp
            connection:
              ref:
                name: weather-mcp-connection
        - mcp:
            ref:
              name: weather-mcp
      links:
        - agent:
            ref:
              name: my-agent
            connection:
              ref:
                name: ai-connection
agents:
  my-agent:
    metadata:
      platform: bedrock
      protocol: a2a
    label: My Agent

mcpServers:
  weather-mcp:
    tags:
      - Geolocation
    metadata:
      transport:
        kind: streamableHttp
        path: /weather/mcp

llmProviders:
  open-ai:
    description: This is a description of the llm.
    metadata:
      platform: OpenAI


connections:
  ai-connection:
    kind: llm
    ref:
      name: open-ai
    spec:
      url: https://api.openai.com/v1/
      configuration:
        apiKey: ${openai.apiKey}

  weather-mcp-connection:
    kind: mcp
    ref:
      name: weather-mcp
    spec:
      url: https://mcp-server-afj4wo.5sc6y6-3.usa-e2.cloudhub.io