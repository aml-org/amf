schemaVersion: 0.1.0-beta
brokers:
  stock-market:
    card:
      protocolVersion: 0.2.9
      name: Stock market version
      description: .
      url: https://locahost:8081/test
      capabilities: {}
      version: 1.0.0
      provider:
        organization: Stock Market Inc.
        url: https://www.insiderinformation.com
      securitySchemes: {}
      security: []
      defaultInputModes:
        - application/json
        - text/plain
      defaultOutputModes:
        - application/json
      skills:
        - id: stock-transactions
          name: Stock Transactions
          description: Manages and analyzes stock market transactions from US congress
          examples:
            - Tell me the stock that is trendy in the last 30 days for the US congress
            - What is the stock that has the most transactions in the last 30 days for the US congress
          inputModes:
            - application/json
            - text/plain
          outputModes:
            - application/json
          tags:
            - maps
    spec:
      llm: my-einstein
      instructions:
        - Your mission is to provide insights and analysis on stock market transactions made by US congress members.
        - If doesn't specify a time frame, assume the last 30 days.
        - If the user asks for a specific stock, provide insights on that stock.
      tools:
        - mcp:
            server: stock-mcp
      links:  []
      policies: {}

services:
  llm-providers:
    my-einstein:
      kind: einstein
      clientId: ${einstein.clientId}
      clientSecret: ${einstein.clientSecret}
      baseUrl: ${salesforce.url}
      modelName: sfdc_ai__DefaultOpenAIGPT35Turbo
      probability: 0.3
      locale: en_US
  mcp-servers:
    - stock-mcp:
        url: http://localhost:8082/
        transport:
          streamableHttp:
            path: /mcp