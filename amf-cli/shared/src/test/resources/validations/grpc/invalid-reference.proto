syntax = "proto3";

option java_multiple_files = true;
option java_package = "io.grpc.examples.test";
option java_outer_classname = "Test";
option objc_class_prefix = "HLW";

package test;

message Message1 {
  repeated string message = 1;
}

message Message3 {
  Message1 other = 2;
  Message2 another = 3;
}
