swagger: '2.0'
info:
  title: Card API with preferHeader, and badRequest responses
  version: 1.0.0
paths:
  /virtualcards:
    post:
      parameters:
        - $ref: '#/parameters/priorityHeader'
      responses:
        '400':
          description: 400 error
          schema:
            $ref: '#/definitions/error'
        default:
          description: badRequest error
          schema:
            # should point to definitions, if not it's a local JSON Path
            $ref: '#/responses/badRequest'  # should link to target node (effective target)
parameters:
  priorityHeader:
    in: header
    name: preferHeader
    type: string
responses:
  badRequest:
    description: The 400 badRequest error
    schema:
      $ref: '#/definitions/error'
definitions:
  error:
    properties:
      message:
        type: string
