  - name: "mcp metadata"
    amf-module: "amf-mcp"
    schema:
      spec: "agent-fabric-schema/src/main/resources/mcp_metadata.json"
      amf: "shared/src/main/resources/schema_mcp_metadata.json"
    instances:
      spec:
        valid: "agent-fabric-schema/src/test/resources/mcp_metadata/basic/valid"
        invalid: "agent-fabric-schema/src/test/resources/mcp_metadata/basic/invalid"
      amf:
        valid: "shared/src/test/resources/instances/valid"
        invalid: "shared/src/test/resources/instances/invalid"
      apb:
