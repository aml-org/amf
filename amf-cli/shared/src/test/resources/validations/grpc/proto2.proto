// 1. Syntax must be explicitly set to proto2
syntax = "proto2";

package old.api.v1;

message UserAccount {
  // 2. REQUIRED: The message is invalid if this is not set.
  // This was removed in Proto3 because it was "brittle" (hard to remove later).
  required int32 id = 1;

  // 3. OPTIONAL: The most common field type.
  optional string username = 2;

  // 4. DEFAULT VALUES: In Proto2, you can specify what a field
  // returns if it was never set.
  optional string account_type = 3 [default = "standard"];
  optional int32 login_count = 4 [default = 0];

  // 5. ENUMS: In Proto2, the first value doesn't have to be 0.
  enum Role {
    ADMIN = 1;
    USER = 2;
  }
  optional Role role = 5 [default = USER];

  // 6. GROUPS: A legacy feature only in Proto2 (deprecated/removed in Proto3)
  // This was a way to nest data without creating a separate message type.
  optional group Metadata = 6 {
    optional string created_at = 7;
    optional string last_login = 8;
  }
}

message Collection {
  // 7. REPEATED: Standard list/array
  repeated int32 tags = 1;
}