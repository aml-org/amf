# This document is no longer just for broker but it allows us to describe the ai network (like a backend for the visualizer that can be deployed)
# This makes the brokers, agents, mcps and llms as first class citizens.
# This not only allows us to deploy brokers but also describe the network that are outside of our platform and visualize it, without the need of crawler
# This does not replace the Exchange UI but provides a declarative way to describe the entire network
# Agent Network Specification
schemaVersion: 1.0.0

label: Weather
# Global Tags are inherited by all elements in the network

# The list of brokers that are part of the network.
brokers:
  weather-agent:
    card: #    The a2a Card
      protocolVersion: 0.2.9
      name: Agent that now how to handle the weather
      description: Provides advanced route planning, traffic analysis, and custom map generation services. This agent can calculate optimal routes, estimate travel times considering real-time traffic, and create personalized maps with points of interest.
      url: https://${ingressgw.url}/weather-agent
      capabilities: { }
      version: 1.0.0
      provider:
        organization: Acme Inc.
        url: https://www.acme.com
      securitySchemes:
        anypointApiKey:
          type: apiKey
          in: header
          name: client_id/client_secret
      defaultInputModes:
        - application/json
        - text/plain
      defaultOutputModes:
        - application/json
        - image/png
      skills:
        - id: weather-agent-skills
          name: Handles the weather
          description: Can calculate the weather for a given location at a given time
          examples:
            - What is the weather in buenos aires in 2025 12 of May
          inputModes:
            - application/json
            - text/plain
          outputModes:
            - application/json
            - application/vnd.geo+json
            - text/html
          tags:
            - weather
    spec: # The spec section defines behavior. In this case of the broker. This means that this definition can be deployed.
      llm:
        ref:
          # Declares that needs a connection to the specified llm.
          name: open-ai
        configuration:
          model: gpt-5-nano

      # Configuration of the broker. Should we put this under a configuration section?
      maxNumberOfLoops: 10
      maxConsecutiveErrors: 1
      instructions:
        - You are a weather agent
      # References the tools to be linked to the broker.
      tools:
        - mcp:
            ref:
              name: weather-mcp
            connection:
              ref:
                name: weather-mcp-connection
        - mcp:
            ref:
              name: weather-mcp
      # References the agents to be linked to the broker.
      links:
        - agent:
            ref:
              name: my-agent
            connection:
              ref:
                name: ai-connection
agents:
  my-agent:
    metadata:
      platform: bedrock
      protocol: a2a
    label: My Agent

mcpServers:
  # We can declare the mcp here.
  # In a future version with the MCP Transcoding work we can potencially create MCP servers automatically form api specs. By adding a spec section to this.
  weather-mcp:
    # Elements in the network can define additional tags that only applies to them
    tags:
      - Geolocation
    metadata:
      transport:
        kind: streamableHttp
        path: /weather/mcp

llmProviders:
  open-ai:
    description: This is a description of the llm.
    metadata:
      platform: OpenAI


#This section describes the physical connections to agents, llms and mcps. This represents the real wireing of the nodes.
connections:
  #Sugar syntax. If registryRef is not specified the name of the connection is used.
  ai-connection:
    kind: llm
    ref:
      name: open-ai
    spec:
      url: https://api.openai.com/v1/
      configuration:
        apiKey: ${openai.apiKey}

  weather-mcp-connection:
    kind: mcp
    ref:
      name: weather-mcp
    spec:
      url: https://mcp-server-afj4wo.5sc6y6-3.usa-e2.cloudhub.io
